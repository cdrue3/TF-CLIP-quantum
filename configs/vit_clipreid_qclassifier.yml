# configs/vit_clipreid_qclassifier.yml
#
# TF-CLIP — Quantum Classifier variant
# Based on vit_clipreid.yml; quantum-specific parameters (n_qubits, n_layers)
# are passed as CLI arguments to train_qclassifier.py, not in this file.
#
# Usage:
#   python train_qclassifier.py \
#       --config_file configs/vit_clipreid_qclassifier.yml \
#       --n_qubits 8 --n_layers 2

MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  NAME: 'ViT-B-16'
  STRIDE_SIZE: [16, 16]
  ID_LOSS_WEIGHT : 0.25
  TRIPLET_LOSS_WEIGHT : 1.0
  I2T_LOSS_WEIGHT : 1.0
  SIE_CAMERA: True
  SIE_COE : 1.0

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  SEQ_LEN: 4

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 4

SOLVER:
  STAGE1:
    IMS_PER_BATCH: 8
    OPTIMIZER_NAME: "Adam"
    BASE_LR: 0.00035
    WARMUP_LR_INIT: 0.00001
    LR_MIN: 1e-6
    WARMUP_METHOD: 'linear'
    WEIGHT_DECAY:  1e-4
    WEIGHT_DECAY_BIAS: 1e-4
    MAX_EPOCHS: 120
    CHECKPOINT_PERIOD: 120
    LOG_PERIOD: 50
    WARMUP_EPOCHS: 5

  STAGE2:
    IMS_PER_BATCH: 8
    OPTIMIZER_NAME: "Adam"
    # Quantum circuits train slower; a slightly lower LR helps stability.
    BASE_LR: 0.000003
    WARMUP_METHOD: 'linear'
    WARMUP_ITERS: 10
    WARMUP_FACTOR: 0.1
    WEIGHT_DECAY:  0.0001
    WEIGHT_DECAY_BIAS: 0.0001
    LARGE_FC_LR: False       # disabled: quantum heads use uniform LR
    LARGE_Prompt_LR: True
    MAX_EPOCHS: 80
    CHECKPOINT_PERIOD: 60
    LOG_PERIOD: 50
    EVAL_PERIOD: 2
    BIAS_LR_FACTOR: 2
    STEPS: [30, 50, 70]
    GAMMA: 0.1

TEST:
  EVAL: False
  IMS_PER_BATCH: 1
  RE_RANKING: False
  WEIGHT: 'logs/mars_vit_clip_reid_qclassifier/best_model.pth.tar'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

DATASETS:
  NAMES: ('mars')
  ROOT_DIR: ('TF-CLIP/DATA/MARS')

OUTPUT_DIR: 'logs/mars_vit_clip_reid_qclassifier'
